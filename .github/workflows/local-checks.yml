name: JARVIS Local checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax and local startup smoke test
        run: npm test
      - name: Check all browser modules
        run: |
          find public/modules -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify HTML references resolve to local files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("public/index.html").read_text(encoding="utf-8")
          refs = re.findall(r'(?:src|href)="\.\/modules\/([^"?]+)', html)
          missing = [name for name in refs if not (Path("public/modules") / name).is_file()]
          if missing:
              raise SystemExit("Missing local module assets: " + ", ".join(missing))
          required = ["jarvis-universal-service-router.js", "jarvis-velve.js", "terranexus.js",
                      "jarvis-neon-nexus.js", "jarvis-vision-intelligence.js",
                      "jarvis-environment-shortcuts.js", "velve-static-satellite-feed.js"]
          absent = [name for name in required if name not in refs]
          if absent:
              raise SystemExit("Required features not referenced by index.html: " + ", ".join(absent))
          print(f"Validated {len(refs)} local module references.")
          PY
